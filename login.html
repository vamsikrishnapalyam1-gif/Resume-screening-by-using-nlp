<!DOCTYPE html>
<html>
<head>
    <title>Resume Screening</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;

            /* MODIFY BACKGROUND HERE */
            background-image:
                linear-gradient(
                    rgba(0, 20, 60, 0.35),
                    rgba(0, 20, 60, 0.35)
                ),
                url("/static/images/resume_background.png");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* MODIFY LOGIN BOX HERE */
        .login-box {
            width: 350px;
            padding: 35px;

            background: rgba(20, 70, 150, 0.85);

            border-radius: 15px;

            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.4);

            text-align: center;
        }

        /* MODIFY TITLE HERE */
        h2 {
            color: white;
            margin-bottom: 5px;
        }

        /* MODIFY SUBTITLE HERE */
        .subtitle {
            color: #bde3ff;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 15px;

            border: 1px solid #5aaeff;
            border-radius: 7px;

            background: rgba(255, 255, 255, 0.12);
            color: white;

            outline: none;
        }

        input::placeholder {
            color: #d5eaff;
        }

        input:focus {
            border-color: #00bfff;
            box-shadow: 0 0 8px rgba(0, 191, 255, 0.5);
        }

        /* MODIFY BUTTON HERE */
        button {
            width: 100%;
            padding: 13px;

            border: none;
            border-radius: 7px;

            background: #1597ff;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #0078d7;
        }

        .error {
            background: rgba(255, 0, 0, 0.2);
            color: #ffb3b3;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h2>Resume Screening</h2>

        <div class="subtitle">
            Admin Login
        </div>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form action="/login" method="POST">

            <input
                type="text"
                name="username"
                placeholder="Username"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

    </div>

</body>
</html>
